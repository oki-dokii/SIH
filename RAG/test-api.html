<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        #output {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🧪 Backend API Test</h1>
    <p>Test the FastAPI backend with RAG engine integration</p>

    <div class="section">
        <h2>1. Upload PDF</h2>
        <input type="file" id="pdfFile" accept=".pdf">
        <button onclick="uploadPDF()">Upload & Process</button>
        <div id="uploadStatus"></div>
    </div>

    <div class="section">
        <h2>2. Chat with PDF</h2>
        <input type="text" id="chatMessage" placeholder="Enter your question..." />
        <button onclick="sendChat()">Send Message</button>
        <div id="chatStatus"></div>
    </div>

    <div class="section">
        <h2>3. View Chat History</h2>
        <button onclick="getChatHistory()">Get History</button>
        <button onclick="clearChat()">Clear Chat</button>
    </div>

    <div class="section">
        <h2>4. List All PDFs</h2>
        <button onclick="listPDFs()">Get PDF List</button>
    </div>

    <div class="section">
        <h2>Output:</h2>
        <div id="output">Waiting for action...</div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let currentPdfId = null;

        function log(message) {
            const output = document.getElementById('output');
            output.textContent = JSON.stringify(message, null, 2);
        }

        async function uploadPDF() {
            const fileInput = document.getElementById('pdfFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a PDF file');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                document.getElementById('uploadStatus').textContent = 'Uploading...';
                const response = await fetch(`${API_BASE}/upload-pdf`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                currentPdfId = data.id;
                document.getElementById('uploadStatus').textContent = 
                    `✓ Uploaded! PDF ID: ${data.id}, Chunks: ${data.num_chunks}`;
                log(data);
            } catch (error) {
                document.getElementById('uploadStatus').textContent = '✗ Upload failed';
                log({ error: error.message });
            }
        }

        async function sendChat() {
            if (!currentPdfId) {
                alert('Please upload a PDF first');
                return;
            }

            const message = document.getElementById('chatMessage').value;
            if (!message) {
                alert('Please enter a message');
                return;
            }

            try {
                document.getElementById('chatStatus').textContent = 'Sending...';
                const response = await fetch(`${API_BASE}/pdf/${currentPdfId}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                document.getElementById('chatStatus').textContent = '✓ Response received';
                document.getElementById('chatMessage').value = '';
                log(data);
            } catch (error) {
                document.getElementById('chatStatus').textContent = '✗ Chat failed';
               log({ error: error.message });
            }
        }

        async function getChatHistory() {
            if (!currentPdfId) {
                alert('Please upload a PDF first');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/pdf/${currentPdfId}/messages`);
                const data = await response.json();
                log(data);
            } catch (error) {
                log({ error: error.message });
            }
        }

        async function clearChat() {
            if (!currentPdfId) {
                alert('Please upload a PDF first');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/pdf/${currentPdfId}/messages`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                log(data);
            } catch (error) {
                log({ error: error.message });
            }
        }

        async function listPDFs() {
            try {
                const response = await fetch(`${API_BASE}/pdfs`);
                const data = await response.json();
                log(data);
            } catch (error) {
                log({ error: error.message });
            }
        }
    </script>
</body>
</html>
